name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14.10"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups --extra masks

      - name: Verify Linux CPU imports
        run: uv run python -c "import torch, torchvision, transformers; assert not torch.cuda.is_available(); print(torch.__version__, torchvision.__version__, transformers.__version__)"

      - name: Audit locked dependencies
        run: uv run --locked python scripts/audit_dependencies.py

      - name: Run tests
        if: github.event_name == 'push'
        run: uv run pytest -m ""

  focused-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.14.10
        run: uv python install 3.14.10

      - name: Install dependencies
        run: uv sync --locked --all-groups --extra masks

      - name: Run focused behavior tests
        run: >-
          uv run pytest -m "" tests/test_config.py tests/test_cli.py
          tests/data/test_identity.py tests/evaluation/test_statistics.py

      - name: Verify Linux CPU imports
        run: uv run python -c "import torch, torchvision, transformers; assert not torch.cuda.is_available(); print(torch.__version__, torchvision.__version__, transformers.__version__)"

      - name: Audit locked dependencies
        run: uv run --locked python scripts/audit_dependencies.py

  linux-target-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Resolve locked Linux core and mask dependencies
        run: uv sync --locked --all-groups --extra masks --dry-run

      - name: Check Linux helper syntax
        run: bash -n scripts/lab_run.sh

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  synthetic-freeze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Build synthetic dataset and freeze manifest
        run: |
          uv run jute-disease data synthetic
          uv run python - <<'PY'
          import json
          from pathlib import Path

          rules = json.loads(Path("configs/data/curation_rules.json").read_text())
          rules["min_support"] = 2
          Path("artifacts/smoke-curation-rules.json").write_text(
              json.dumps(rules), encoding="utf-8"
          )
          PY
          uv run jute-disease freeze target --image-root artifacts/synthetic --rules artifacts/smoke-curation-rules.json

      - name: Plan the queue on the frozen manifest
        run: |
          uv run jute-disease stack --allow-cpu
          uv run jute-disease queue plan --allow-cpu --image-root artifacts/synthetic
