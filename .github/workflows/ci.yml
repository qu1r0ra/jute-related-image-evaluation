name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WANDB_MODE: disabled
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  smoke:
    runs-on: ubuntu-latest
    env:
      WANDB_MODE: disabled

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build synthetic dataset and freeze manifest
        run: |
          uv run jute-disease data synthetic
          uv run python - <<'PY'
          import json
          from pathlib import Path

          rules = json.loads(Path("configs/data/curation_rules.json").read_text())
          rules["min_support"] = 2
          Path("artifacts/smoke-curation-rules.json").write_text(
              json.dumps(rules), encoding="utf-8"
          )
          PY
          uv run jute-disease freeze target --image-root artifacts/synthetic --rules artifacts/smoke-curation-rules.json

      - name: Plan the queue on the frozen manifest
        run: |
          uv run jute-disease stack --allow-cpu
          uv run jute-disease queue plan --allow-cpu --image-root artifacts/synthetic
