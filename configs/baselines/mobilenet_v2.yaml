seed_everything: 42
trainer:
  accelerator: auto
  devices: auto
  gradient_clip_val: 1.0
  precision: 16-mixed
  max_epochs: 50
  log_every_n_steps: 25
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: artifacts/logs
      name: mobilenet_v2
  callbacks:
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val_loss
      dirpath: artifacts/checkpoints/mobilenet_v2
      filename: mobilenet_v2-{epoch:02d}-{val_loss:.4f}
      save_top_k: 1
      mode: min
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val_loss
      patience: 5
      mode: min
  - class_path: lightning.pytorch.callbacks.TQDMProgressBar
    init_args:
      refresh_rate: 50
model:
  num_classes: 6
  lr: 0.001
  freeze_backbone: true
  compile_model: false
  feature_extractor:
    class_path: jute_disease.models.dl.backbone.TimmBackbone
    init_args:
      model_name: mobilenetv2_100.ra_in1k
      pretrained: true
data:
  data_dir: null
  manifest_dir: artifacts/freeze/target
  image_root: data/by_class
  batch_size: 32
  use_weighted_sampler: true
  k_fold: 1
  image_size: 256
