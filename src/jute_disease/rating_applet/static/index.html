<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rating sitting</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><main>
<header><div><h1>Rating sitting</h1><p id="progress" aria-live="polite"></p></div><p id="mode"></p></header>
<p id="notice" role="status" aria-live="polite"></p>
<div class="workspace"><section aria-label="Image"><h2 id="position">Image</h2><div class="image-frame"><img id="picture" alt="Image for this item"></div><div class="zoom"><button id="zoom" type="button">Inspect full resolution</button><label for="scale">Zoom</label><input id="scale" type="range" min="1" max="4" step="0.25" value="1"></div><p id="image-status" role="status"></p></section>
<section aria-label="Rating choices"><div id="choices"></div><p id="save" role="status" aria-live="polite"></p><button id="undo" type="button">Undo last choice</button></section></div>
<nav aria-label="Sitting navigation"><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button><button id="finish" type="button">Finish sitting</button></nav>
</main></body></html>
