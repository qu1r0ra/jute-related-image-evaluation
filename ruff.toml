extend-exclude = ["notebooks/**/*.py", "notebooks/historical"]
line-length = 88
target-version = "py314"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
ignore = ["N812", "N803", "N806"]
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"notebooks/**/*.ipynb" = ["E501", "A004", "T201"]
"tests/**/*.py" = ["E402", "E501"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
