[project]
name = "jute-disease-detection"
version = "1.0.0"
description = "Deep Learning Exploration for Jute Leaf Disease Detection"
license = "Apache-2.0"
authors = [{ name = "Christian Joseph Bunyi" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentationsx[headless]>=2.0.14",
    "captum>=0.7.0",
    "kagglehub>=0.4.2",
    "lightning[pytorch-extra]>=2.6.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.1",
    "pillow>=12.1.0",
    "python-dotenv>=1.2.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "timm>=1.0.24",
    "torch",
    "torchvision",
    "umap-learn>=0.5.11",
    "wandb>=0.24.0",
]

[project.scripts]
jute-disease = "jute_disease.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupytext>=1.19.1",
    "pre-commit>=4.5.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "setuptools>=82.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/jute_disease"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (deselected by default; run with -m slow)",
]
