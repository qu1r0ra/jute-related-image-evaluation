[project]
name = "jute-related-image-evaluation"
version = "1.0.0"
description = "Deep Learning Exploration for Jute Leaf Disease Detection"
license = "Apache-2.0"
authors = [{ name = "Christian Joseph Bunyi" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "joblib>=1.6.0",
    "jsonargparse[signatures]>=4.53.0",
    "kagglehub>=0.4.2",
    "lightning>=2.6.6",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.1",
    "pillow>=12.1.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "timm>=1.0.24",
    "torch==2.14.1",
    "torchmetrics>=1.9.0",
    "torchvision==0.29.1",
]

[project.scripts]
jute-disease = "jute_disease.cli:main"

[project.optional-dependencies]
masks = [
    "transformers>=5.22.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupytext>=1.19.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.5.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "setuptools>=82.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jute_disease"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (deselected by default; run with -m slow)",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
